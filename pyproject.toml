[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-miner"
version = "0.1.0"
description = "AI-powered agent that mines multi-source user signals into traceable product requirement assets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SignalMiner Team"},
]
keywords = ["ai", "product-management", "feedback-mining", "requirements", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",

    # LLM clients
    "openai>=1.14.0",
    "google-genai>=1.0.0",

    # State management
    "redis[hiredis]>=5.0.0",

    # Streaming
    "sse-starlette>=2.1.0",

    # Data models and validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # Frontend Web UI
    "streamlit>=1.34.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",

    # Async HTTP
    "httpx>=0.27.0",

    # Utilities
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",

    # Data processing & local offline Chinese embeddings
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "fastembed>=0.9.0",
]

[project.optional-dependencies]
browser = [
    # Current Chrome DOM transport only; no browser binary installation.
    "websockets>=15,<17",
]

dev = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
]

postgres = [
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
]

[project.scripts]
signal-miner = "signal_miner.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["signal_miner*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S101", "ARG", "FBT"]

[tool.ruff.lint.isort]
known-first-party = ["signal_miner"]
force-sort-within-sections = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["signal_miner"]
omit = ["*/tests/*", "*/test_*", "*/__init__.py"]
